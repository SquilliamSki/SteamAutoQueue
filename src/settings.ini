; ============================================================
;  Steam Auto Queue - settings
;  Change a value, save the file, done. The tray helper picks
;  up changes within a few seconds - no restart needed.
;  (Pause / resume is in the tray icon's right-click menu.)
;  Lines starting with ; are notes and are ignored.
; ============================================================

; --- WHEN TO QUEUE UPDATES -----------------------------------

; Queue everything each time Steam starts.  (true / false)
RunWhenSteamStarts = true

; How long to wait after Steam starts, in seconds, so Steam has
; time to sign in and find new updates first.
StartupDelaySeconds = 60

; Also queue once a day at this time (24-hour clock, e.g. 03:00
; or 19:30). Leave blank to turn off.
; If the PC is off or asleep at that time, it runs as soon as
; Steam is open later that same day.
DailyTime =

; If Steam is closed at DailyTime, start it quietly in the
; background so the updates can download.  (true / false)
StartSteamForDailyRun = false

; After a run, keep checking every this-many minutes while Steam
; stays open, so new updates don't sit in Scheduled. 0 = off.
RecheckEveryMinutes = 30


; --- WHAT TO QUEUE -------------------------------------------

; Steam's "Unscheduled" list holds updates you removed by hand.
; Leave false to respect that; true to queue those too.
QueueUnscheduledToo = false

; Games to never touch, by App ID, separated by commas.
; The App ID is the number in a game's Steam store page address,
; e.g. store.steampowered.com/app/570/ -> 570
ExcludeAppIds =


; --- BEHAVIOR ------------------------------------------------

; If Steam was opened without the helper switch (say, after a
; Steam client update), restart Steam once to turn it on. Only
; happens right after Steam opens and never while a game is
; running.  (true / false)
AutoFixSteam = true

; Show a small Windows notification when updates get queued.
ShowNotifications = true

; Check once a week whether a newer version of this tool is out
; (asks GitHub; nothing about you or your PC is sent).
CheckForUpdates = true

; Practice mode: write what WOULD be queued to the log, but don't
; actually queue anything.  (true / false)
TestMode = false


; --- ADVANCED (leave alone unless you know you need it) ------

; Port Steam's helper switch listens on, on this PC only.
DebugPort = 8080
